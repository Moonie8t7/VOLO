name: Report a bug
description: Something on the site or in the sorter misbehaved. Wrong placements have their own template.
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: What you did, what you got, and what you expected instead.
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: What did you import?
      description: Most sorting bugs depend on the file format, so this narrows things quickly.
      options:
        - Full BG3 Mod Manager export
        - Short BG3 Mod Manager export
        - modsettings.lsx
        - CSV or TSV
        - Plain list of names
        - Not related to importing
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: Firefox 143 on Windows 11
  - type: textarea
    id: console
    attributes:
      label: Console errors, if any
      description: >
        Press F12, open the Console tab, and paste anything red. Empty is a
        useful answer too.
      render: text
  - type: textarea
    id: file
    attributes:
      label: The file that triggered it
      description: >
        If the bug involves a specific load order file, paste or attach it.
        Files posted here are public; the site never uploads your order, but
        this issue tracker does.
      render: json
