name: Catalogue crawl

# Keeps the Nexus and mod.io reference catalogues current, then rebuilds
# everything derived from them. Runs on GitHub's machines so it does not depend
# on any particular computer being switched on.
#
# Needs the NEXUS_API_KEY and MODIO_API_KEY repository secrets. A half whose key
# is missing is skipped by the step's own `if`, so it shows as a skipped step in
# the run rather than printing a message that reads like a failure. Actions
# echoes every line of a shell block before running it, so guards written in
# shell appear in the log whether or not they fire, which is misleading.
#
# Both crawlers are resumable and quota-aware: they record their own progress,
# so a run that stops early simply continues tomorrow.
#
# This runs in its own concurrency group rather than the masterlist one it used
# to share. GitHub keeps a single pending run per group, so a third arrival
# cancels the one already waiting, and a cancelled job never reaches its
# reporting step: the submitter hears nothing at all on an issue that stays
# open. A crawl holds its group for many minutes while fetching two
# catalogues, which made that collision likely rather than theoretical. It
# still regenerates the same derived files, so its commit step rebases the
# crawl output alone and rebuilds everything derived from the merged state,
# which resolves the race without needing a lock at all.

on:
  schedule:
    - cron: "20 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NEXUS_API_KEY: ${{ secrets.NEXUS_API_KEY }}
      MODIO_API_KEY: ${{ secrets.MODIO_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The daily updates crawl only sees mods whose update timestamp moved,
      # and not every listing change moves it. Once a month the full sweep
      # restarts from offset zero so every listing gets re-read regardless.
      - name: Monthly full resweep
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            echo "RESWEEP=--restart" >> "$GITHUB_ENV"
          fi

      # Listing first (most endorsed, then newest updates), then the joins that
      # turn a catalogue into usable metadata.
      - name: Nexus catalogue
        if: env.NEXUS_API_KEY != ''
        run: |
          node scripts/bulk-list-nexus.mjs $RESWEEP
          node scripts/bulk-list-nexus.mjs --updates
          node scripts/find-masterlist-on-nexus.mjs
          node scripts/crawl-requirements.mjs
          node scripts/enrich-from-nexus.mjs

      - name: mod.io catalogue
        if: env.MODIO_API_KEY != ''
        run: |
          node scripts/bulk-list-modio.mjs $RESWEEP
          node scripts/bulk-list-modio.mjs --updates
          node scripts/bulk-list-modio.mjs --deps

      # Catalogue data feeds the Script Extender flags and the promoted
      # dependency edges, so a crawl that does not rebuild these leaves the site
      # running on yesterday's derivation. The category map rebuilds before the
      # mine, because the mine reads it; the other order fed every crawl's
      # masterlist the previous day's map.
      - name: Rebuild what the catalogues feed
        run: |
          node scripts/build-external-categories.mjs
          node scripts/mine-corpus.mjs
          node scripts/build-divider-map.mjs
          node -e "require('fs').copyFileSync('masterlist/bg3-masterlist.json','public/bg3-masterlist.json')"
          node -e "require('fs').copyFileSync('masterlist/external-categories.json','public/external-categories.json')"

      # The crawled catalogues are the only thing that rebases.
      #
      # A submission landing mid-crawl regenerates the same derived files this
      # run just built, and rebasing one set onto the other conflicts on every
      # one of them. So commit the crawl output alone, rebase that, then derive
      # the masterlist, measurement and figures from the merged state, which is
      # the only state holding both the new catalogues and any order that
      # arrived meanwhile.
      - name: Commit whatever changed
        id: commit
        run: |
          set -euo pipefail
          git config user.name "volo-crawler"
          git config user.email "crawler@users.noreply.github.com"

          git add nexus modio
          if git diff --cached --quiet; then
            echo "changed=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for attempt in 1 2 3; do
            git checkout -- masterlist public client/src/lib README.md docs/decisions.md 2>/dev/null || true
            git add nexus modio
            git diff --cached --quiet && { echo "changed=no" >> "$GITHUB_OUTPUT"; exit 0; }
            git commit -m "Update the catalogues"

            if ! git pull --rebase origin main; then
              git rebase --abort || true
              git reset --hard origin/main
              continue
            fi

            node scripts/build-external-categories.mjs
            node scripts/mine-corpus.mjs
            node scripts/build-divider-map.mjs
            node -e "require('fs').copyFileSync('masterlist/bg3-masterlist.json','public/bg3-masterlist.json')"
            node -e "require('fs').copyFileSync('masterlist/external-categories.json','public/external-categories.json')"
            node scripts/verify-holdout.mjs | tail -8 >> "$GITHUB_STEP_SUMMARY"
            node scripts/sync-figures.mjs

            # Pushes made with the workflow token do not trigger the checks
            # workflow, so this would otherwise land unverified.
            npm run check
            npm run build
            npm test

            git add masterlist public client/src/lib README.md docs/decisions.md
            git commit --amend --no-edit -m "Update the catalogues and regenerate"

            if git push origin HEAD:main; then
              echo "changed=yes" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git reset --hard origin/main
          done

          echo "could not land the crawl after three attempts"
          exit 1

      # The whole point of the run, in one place, whatever happened above.
      - name: Summary
        if: always()
        run: |
          {
            node scripts/crawl-summary.mjs
            echo "| | |"
            echo "|---|---|"
            echo "| Nexus half | ${{ env.NEXUS_API_KEY != '' && 'ran' || 'skipped, no NEXUS_API_KEY' }} |"
            echo "| mod.io half | ${{ env.MODIO_API_KEY != '' && 'ran' || 'skipped, no MODIO_API_KEY' }} |"
            echo "| Committed | ${{ steps.commit.outputs.changed == 'yes' && 'yes' || 'nothing changed' }} |"
            echo
            node scripts/verify-order.mjs | tail -5
          } >> "$GITHUB_STEP_SUMMARY"
