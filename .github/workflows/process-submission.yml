name: Process load order submission

# A submission issue arrives and is validated. Any order that leaves the
# verification metric intact lands on main directly, whether its submitter said
# it worked or not, with the masterlist regenerated from the whole corpus in the
# same commit. Only an order that drops agreement past the tolerance becomes a
# pull request carrying the corpus file, for a person to look at.
#
# Broken orders used to wait for a person on principle. Their value is the
# written diagnosis, and holding them did not make anybody read it: the
# diagnosis is posted to the issue either way, so all the hold achieved was a
# corpus that waited on somebody being at a keyboard. What a broken order
# contributes settles whether that is safe. It adds presence and the section
# headers its submitter wrote, and it never contributes sequence, because
# `workingPositions` in the miner is built from working orders alone. So no
# ordering is ever learned from an order that did not run.
#
# A held order waits on its own issue, labelled `held-for-review`, and is
# accepted by adding `approved`. There is no branch and no pull request. Both
# routes land by the same path, so an order a person waved through arrives
# exactly as a clean one does: one commit holding the order and everything
# derived from it.
#
# The corpus-only branch this used to open carried an order the README did not
# describe, so its own checks failed on it and that red mark showed every time
# somebody looked, at exactly the moment they were deciding whether to accept.
# Two open at once also collided on provenance.json. None of it was load-bearing:
# approval replays from the issue body, so the branch never reached main.
#
# Runs are serialised: two submissions regenerating the masterlist at once
# would each build it without the other's order, and the later push would
# silently drop the earlier one.

# `labeled` is the reprocess lever: intake improves, and an order rejected by
# an older version should get another run without asking its submitter to
# refile. Removing and re-adding the label replays it.
on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  # To start the checks workflow on what this run pushes, since a push made
  # with the workflow token starts nothing by itself.
  actions: write

concurrency:
  group: masterlist
  cancel-in-progress: false

jobs:
  process:
    # A wrong placement report carries the reporter's own load order, and that
    # order is the thing that actually fixes placements: it teaches where every
    # mod in it belongs, not just the one being reported. It only enters the
    # corpus when the reporter has said they played on it, because provenance
    # is what the whole anti-feedback rule rests on.
    #
    # Recognised by the shape of the template's own answers as well as by the
    # label, because the label was the only test and it never arrived. GitHub
    # drops a label an issue template asks for when the repository does not
    # have it, silently and with no error anywhere, and `wrong-placement` had
    # never been created. So this branch had never once run, on any report,
    # while reading as though it were handled. A heading the template writes
    # into every body cannot go missing the same way.
    if: >
      contains(github.event.issue.labels.*.name, 'load-order-submission') ||
      contains(github.event.issue.body, '### Does this load order work?') ||
      ((contains(github.event.issue.labels.*.name, 'wrong-placement') ||
        contains(github.event.issue.body, '### Where VOLO put it')) &&
       contains(github.event.issue.body, 'Working, I have played on it'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so build-sitemap can read each page's real last
          # change date. A shallow clone reports HEAD for every file.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Write issue body to file
        env:
          BODY: ${{ github.event.issue.body }}
        run: printf '%s' "$BODY" > /tmp/issue-body.txt

      - name: Process the submission
        id: process
        env:
          # Read from the event rather than interpolated into the script, so a
          # label containing a quote cannot end the command and run the rest.
          # As JSON, because a label may contain a comma and splitting a joined
          # string back apart would be a guess that decides whether an order lands.
          LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
        run: |
          set +e
          node scripts/process-submission.mjs \
            --body /tmp/issue-body.txt \
            --number "${{ github.event.issue.number }}" \
            --labels "$LABELS" \
            --report /tmp/report.md \
            --gate /tmp/gate.json
          code=$?
          set -e
          if [ $code -eq 0 ]; then accepted=yes; else accepted=no; fi
          automerge=$(node -e "try{process.stdout.write(String(require('/tmp/gate.json').autoMerge===true))}catch{process.stdout.write('false')}")
          final=$(node -e "try{process.stdout.write(String(require('/tmp/gate.json').final===true))}catch{process.stdout.write('false')}")
          echo "accepted=$accepted" >> "$GITHUB_OUTPUT"
          echo "automerge=$automerge" >> "$GITHUB_OUTPUT"
          echo "final=$final" >> "$GITHUB_OUTPUT"
          echo "accepted=$accepted automerge=$automerge final=$final"

      # The corpus file is the only thing that rebases.
      #
      # Two submissions landing close together each regenerate the masterlist,
      # the measurement and the prose from their own view of the corpus, and
      # rebasing the second onto the first collided on every one of those
      # artifacts. The rebase aborted, the run failed after the accepted
      # comment had already been posted, and five orders were reported as
      # landed while never reaching main. So: commit the submitted order alone,
      # rebase that, and only then derive everything from the merged corpus,
      # which is the only state that includes both orders anyway.
      - name: Land it on main
        id: land
        if: steps.process.outputs.accepted == 'yes' && steps.process.outputs.automerge == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "volo-submissions"
          git config user.email "submissions@users.noreply.github.com"

          # Captured once, because each attempt resets the tree to whatever
          # main now holds and that throws away the very file being landed.
          # Without this a rejected push left nothing to retry with, and the
          # loop reported "nothing to land" on a real submission.
          git add "Load Orders - Public Submitted"
          git diff --cached --quiet && { echo "nothing to land"; exit 1; }

          # The order file, not merely the first staged path. Intake also writes
          # provenance.json, git lists staged paths byte-sorted, and a
          # `working_` order sorts after `provenance.json` while a
          # `not_working_` one sorts before it. So on exactly the orders that
          # land automatically, this picked provenance.json, and the guard below
          # then asked whether provenance.json was on main. It always is. Any
          # failed apply was therefore reported as already landed, the issue was
          # closed with "Merged automatically", and the order was never
          # committed. Issue #67 was lost that way and nothing noticed.
          order=$(git diff --cached --name-only | grep -v '/provenance\.json$' | head -1)
          if [ -z "$order" ]; then
            echo "no order file staged, only derived state"
            exit 1
          fi

          # Only the order file is replayed as a patch, and provenance.json is
          # carried as data instead.
          #
          # Each attempt rebases onto whatever main now holds, and every
          # submission adds a record to the same sorted map, so two orders
          # landing minutes apart conflict there on lines neither of them means
          # to disagree about. The order file is new and always applies.
          #
          # This is the same collision that made corpus pull requests
          # unworkable, noted further down. It was solved for branches by
          # removing them, and left standing on the path everything actually
          # takes. Issue #105 was accepted, reported and then lost to it when
          # #104 landed first.
          git diff --cached -- "$order" > /tmp/submission.patch
          node scripts/graft-provenance.mjs read "$(basename "$order")" > /tmp/provenance-entry.json

          # One submission starts two runs. An issue created with its label
          # already on emits `opened` and `labeled` together, and both match,
          # so a second run processes the same order while the first is
          # landing it. The loser then fails here, because the file it is
          # adding is already on main, and its report told the submitter the
          # order had not landed while it sat in the corpus. That is the
          # earlier "accepted but never landed" bug wearing the other face,
          # and it reached three of the last four submissions.
          landed_already() {
            git fetch origin main --quiet
            git cat-file -e "origin/main:$order" 2>/dev/null
          }

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            git apply --whitespace=nowarn /tmp/submission.patch || {
              if landed_already; then
                echo "already on main: the run started by the other event landed it"
                echo "landed=yes" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "the submitted order no longer applies to main"
              exit 1
            }
            node scripts/graft-provenance.mjs write "$(basename "$order")" /tmp/provenance-entry.json
            git add "Load Orders - Public Submitted"
            git commit -m "Add load order from issue #${{ github.event.issue.number }}"

            node scripts/mine-corpus.mjs
            node scripts/build-divider-map.mjs
            node -e "require('fs').copyFileSync('masterlist/bg3-masterlist.json','public/bg3-masterlist.json')"
            node scripts/verify-holdout.mjs | tail -8 >> "$GITHUB_STEP_SUMMARY"
            node scripts/sync-figures.mjs

            # Pushes made with the workflow token do not trigger the checks
            # workflow, so this would otherwise land unverified.
            npm run check
            npm run build
            npm test

            git add masterlist public client/src/lib README.md docs/decisions.md
            git commit --amend --no-edit -m "Add load order from issue #${{ github.event.issue.number }} and regenerate the masterlist"

            if git push origin HEAD:main; then
              echo "landed=yes" >> "$GITHUB_OUTPUT"
              gh workflow run checks.yml --ref main \
                || echo "could not start checks on the new tip"
              exit 0
            fi
            # Something landed while this run was building. The next attempt
            # starts again from that new tip, patch and all.
            echo "push rejected on attempt $attempt, rebuilding on the new tip"
          done

          echo "could not land after three attempts"
          exit 1

      # Only once the push is real. Closing on the strength of the validation
      # alone is how five submitters were thanked for orders that never landed.
      - name: Close the issue
        if: steps.land.outputs.landed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED: ${{ contains(github.event.issue.labels.*.name, 'approved') }}
        run: |
          if [ "$APPROVED" = "true" ]; then
            note="Approved and landed. The masterlist was regenerated from the whole corpus in the same commit. Thank you."
          else
            note="Merged automatically: the order validated and left the verification metric intact. Thank you."
          fi
          gh issue close "${{ github.event.issue.number }}" --comment "$note"

      # An order held for review already has a pull request carrying its corpus
      # file. Approving lands that order on main by the direct path, so the
      # branch has nothing left to contribute and merging it now would add the
      # very commit this exists to avoid: an order the README does not yet
      # describe, failing its own checks for good.
      # Approval is spent once it has landed something, and the hold is over.
      #
      # The label is a grant attached to an issue, and an issue can be edited
      # after it is given. Intake replays on `edited`, so an approval left in
      # place would wave through whatever the body said next, without anyone
      # reading it. What a person approved was the order in front of them, not
      # the issue for the rest of its life.
      #
      # `always()` rather than a bare `if:`, which GitHub reads as
      # `success() && ...`. That tied this to the step above it, so a failed
      # comment left the label on and the next edit could land unread.
      - name: Clear the labels this order was carrying
        if: always() && steps.land.outputs.landed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for label in approved held-for-review; do
            gh issue edit "${{ github.event.issue.number }}" --remove-label "$label" \
              || echo "no $label label to remove"
          done

      # A held order waits on its issue, not on a branch.
      #
      # It used to get a corpus-only pull request. That branch carried an order
      # the README did not describe, so its own checks failed on it, and the same
      # failure fired every time somebody looked at it: a red mark that meant
      # nothing at exactly the moment a person was deciding whether to accept.
      # Two branches open at once also collided on provenance.json, because each
      # added a record to the same sorted map.
      #
      # None of it was load-bearing. Approval replays the submission from the
      # issue body and lands it directly, so the branch was never the thing that
      # reached main; it was a copy waiting to be thrown away. The issue already
      # holds the full report, and the issue is what carries the label.
      - name: Say that it is waiting for a person
        if: steps.process.outputs.accepted == 'yes' && steps.process.outputs.automerge != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue edit "${{ github.event.issue.number }}" --add-label held-for-review \
            || echo "could not label the issue"

      # Always runs. A submitter who hears nothing assumes the tool is broken,
      # and the report is the only feedback they get, so a failure earlier must
      # not also swallow the explanation.
      - name: Report back on the issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s /tmp/report.md ]; then
            printf 'The intake job did not complete. A maintainer will look at this submission.\n' > /tmp/report.md
          fi
          # The report is written while validating, before the order is pushed,
          # so on its own it promises an outcome that has not happened yet.
          # Five submitters were told their order had landed when the push had
          # actually failed; the truth is only known here.
          #
          # And checked against main rather than taken from this job's own
          # steps. Both times this sentence has been wrong it was because a
          # step output described one run's view of a submission two runs were
          # working on. Whether the corpus holds the order is not a matter of
          # opinion, so it is looked up.
          if [ "${{ steps.process.outputs.accepted }}" = "yes" ] \
             && [ "${{ steps.process.outputs.automerge }}" = "true" ] \
             && [ "${{ steps.land.outputs.landed }}" != "yes" ]; then
            git fetch origin main --quiet || true
            if git ls-tree --name-only origin/main "Load Orders - Public Submitted/" \
               | grep -q "issue-${{ github.event.issue.number }}_"; then
              echo "not reporting a failure: the order is on main, landed by the run the other event started"
            else
              printf '\n---\n\n**This order validated but did not land.** Something went wrong while committing it, so it is not in the corpus yet. Nothing is wrong with your submission and it does not need resending: a maintainer will replay it.\n' >> /tmp/report.md
            fi
          fi
          # One submission starts two runs, because an issue created with its
          # label already on emits `opened` and `labeled` together. The landing
          # path has guarded against that for a while; the reporting path never
          # did, so every submitter has been reading their verdict twice. The
          # runs are serialised by the concurrency group above, so by the time
          # the second one reaches here the first one's comment is already on
          # the issue and can be compared against.
          # Matched on a digest of the whole report rather than on its first
          # line. Every rejection opens with the same words, and editing the
          # issue to fix one is the documented way to retry, so comparing the
          # opening would swallow the second, different reason and leave the
          # submitter staring at the first. The marker is an HTML comment, so
          # it is invisible in the rendered issue.
          marker="<!-- volo-report:$(sha256sum /tmp/report.md | cut -c1-16) -->"
          if gh issue view "${{ github.event.issue.number }}" \
               --json comments \
               --jq '.comments[] | select(.author.login == "github-actions") | .body' \
             | grep -Fq "$marker"; then
            echo "not commenting: the run the other event started has already said exactly this"
          else
            printf '\n%s\n' "$marker" >> /tmp/report.md
            gh issue comment "${{ github.event.issue.number }}" --body-file /tmp/report.md
          fi

      # A rejection nothing can change. Editing an issue re-runs intake, so a
      # submission that could not be read stays open for the submitter to fix;
      # an order already in the corpus never stops being so, and leaving it
      # open puts a decision in the list that nobody has to make. Last, so the
      # explanation above is posted before the issue closes under it.
      - name: Close a rejection nothing can change
        if: always() && steps.process.outputs.accepted == 'no' && steps.process.outputs.final == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}"
