name: Process load order submission

# A submission issue arrives and is validated. A working order that leaves the
# verification metric intact lands on main directly, with the masterlist
# regenerated from the whole corpus in the same commit. Anything else becomes a
# pull request carrying only the corpus file, for a person to look at.
#
# Runs are serialised: two submissions regenerating the masterlist at once
# would each build it without the other's order, and the later push would
# silently drop the earlier one.

# `labeled` is the reprocess lever: intake improves, and an order rejected by
# an older version should get another run without asking its submitter to
# refile. Removing and re-adding the label replays it.
on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: masterlist
  cancel-in-progress: false

jobs:
  process:
    if: contains(github.event.issue.labels.*.name, 'load-order-submission')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Write issue body to file
        env:
          BODY: ${{ github.event.issue.body }}
        run: printf '%s' "$BODY" > /tmp/issue-body.txt

      - name: Process the submission
        id: process
        run: |
          set +e
          node scripts/process-submission.mjs \
            --body /tmp/issue-body.txt \
            --number "${{ github.event.issue.number }}" \
            --report /tmp/report.md \
            --gate /tmp/gate.json
          code=$?
          set -e
          if [ $code -eq 0 ]; then accepted=yes; else accepted=no; fi
          automerge=$(node -e "try{process.stdout.write(String(require('/tmp/gate.json').autoMerge===true))}catch{process.stdout.write('false')}")
          echo "accepted=$accepted" >> "$GITHUB_OUTPUT"
          echo "automerge=$automerge" >> "$GITHUB_OUTPUT"
          echo "accepted=$accepted automerge=$automerge"

      # A landed order changes every figure the prose quotes, and nobody is
      # awake to transcribe them: the last submission arrived at night and the
      # checks failed on stale figures until morning. The measurement JSON
      # feeds the site; the sync rewrites the README and decisions prose.
      - name: Re-measure and sync the quoted figures
        if: steps.process.outputs.accepted == 'yes' && steps.process.outputs.automerge == 'true'
        run: |
          node scripts/verify-holdout.mjs | tail -8 >> "$GITHUB_STEP_SUMMARY"
          node scripts/sync-figures.mjs

      # Pushes made with the workflow token do not trigger the checks
      # workflow, so this commit would land unverified. Run the same gate here
      # and fail before pushing anything that would not have passed it.
      - name: Run the checks this push cannot trigger
        if: steps.process.outputs.accepted == 'yes' && steps.process.outputs.automerge == 'true'
        run: |
          npm run check
          npm run build
          npm test

      - name: Land it on main
        if: steps.process.outputs.accepted == 'yes' && steps.process.outputs.automerge == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "volo-submissions"
          git config user.email "submissions@users.noreply.github.com"
          # The masterlist in this commit was regenerated from the full corpus
          # including this order, moments ago, so it is never stale.
          git add "Load Orders - Public Submitted" masterlist public/bg3-masterlist.json client/src/lib/masterlist-summary.json client/src/lib/measured.json README.md docs/decisions.md
          git commit -m "Add load order from issue #${{ github.event.issue.number }} and regenerate the masterlist"
          # Another run may have landed between checkout and now.
          git pull --rebase origin main
          git push origin HEAD:main
          gh issue close "${{ github.event.issue.number }}" \
            --comment "Merged automatically: the order validated and left the verification metric intact. Thank you."

      - name: Open a pull request for review
        if: steps.process.outputs.accepted == 'yes' && steps.process.outputs.automerge != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="submission/issue-${{ github.event.issue.number }}"
          git config user.name "volo-submissions"
          git config user.email "submissions@users.noreply.github.com"
          # Only the corpus file. The masterlist is derived, and regenerating it
          # on main after the merge is what keeps it consistent with every
          # order rather than with whichever branch merged last.
          git checkout -- masterlist public/bg3-masterlist.json
          git checkout -B "$BRANCH"
          git add "Load Orders - Public Submitted"
          git commit -m "Add load order from issue #${{ github.event.issue.number }}"
          git push -f origin "$BRANCH"
          printf '\nCloses #%s\n' "${{ github.event.issue.number }}" >> /tmp/report.md
          gh pr create \
            --title "Load order submission #${{ github.event.issue.number }}" \
            --body-file /tmp/report.md \
            --head "$BRANCH" || gh pr edit "$BRANCH" --body-file /tmp/report.md

      # Always runs. A submitter who hears nothing assumes the tool is broken,
      # and the report is the only feedback they get, so a failure earlier must
      # not also swallow the explanation.
      - name: Report back on the issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s /tmp/report.md ]; then
            printf 'The intake job did not complete. A maintainer will look at this submission.\n' > /tmp/report.md
          fi
          gh issue comment "${{ github.event.issue.number }}" --body-file /tmp/report.md
