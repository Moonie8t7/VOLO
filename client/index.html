<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Tells the browser to render scrollbars, form controls and the address
         bar dark, which it will not infer from a class on the body. -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#161411" />
    <title>VOLO: Load Order Optimisation for Baldur's Gate 3</title>
    <meta name="description" content="Sort your Baldur's Gate 3 mod load order against orders players have actually played on. Runs in your browser, nothing to install, and every placement shows its reasoning." />
    <link rel="icon" href="/assets/volo-logo.png" />
    <!--
      Defaults for the home page and for anything reading the HTML before the
      app runs. src/lib/head.ts rewrites both as the route changes.
    -->
    <link rel="canonical" href="https://volobg3.com/" />
    <meta name="robots" content="index, follow" />

    <meta property="og:title" content="VOLO: Load Order Optimisation for Baldur's Gate 3" />
    <meta property="og:description" content="Sort your BG3 mod load order against a community-curated masterlist. Free, no upload, no account." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://volobg3.com/" />
    <meta property="og:image" content="https://volobg3.com/assets/volo-logo.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Describes the tool itself. Kept in the static HTML so it is readable
      without executing the app, and deliberately limited to what is true:
      a free browser tool, no ratings invented, no offers.
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "VOLO",
      "alternateName": [
        "Verified Order and Load Optimisation",
        "VOLO BG3",
        "VOLO Baldur's Gate 3"
      ],
      "url": "https://volobg3.com/",
      "applicationCategory": "UtilitiesApplication",
      "operatingSystem": "Any, runs in a web browser",
      "browserRequirements": "Requires JavaScript",
      "description": "Sorts Baldur's Gate 3 mod load orders against a masterlist built from load orders players have played on, resolving declared dependencies and explaining every placement.",
      "isAccessibleForFree": true,
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "GBP" },
      "license": "https://github.com/Moonie8t7/VOLO/blob/main/LICENSE",
      "codeRepository": "https://github.com/Moonie8t7/VOLO",
      "sameAs": ["https://github.com/Moonie8t7/VOLO"],
      "about": { "@type": "VideoGame", "name": "Baldur's Gate 3" }
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet">
  </head>
  <body class="dark bg-background text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
