name: Catalogue crawl

# Keeps the Nexus and mod.io reference catalogues current, then rebuilds
# everything derived from them. Runs on GitHub's machines so it does not depend
# on any particular computer being switched on.
#
# Needs the NEXUS_API_KEY and MODIO_API_KEY repository secrets. Each half skips
# itself with a clear line when its key is absent, so a missing key degrades
# one source rather than failing the run.
#
# Both crawlers are resumable and quota-aware: they record their own progress,
# so a run that stops early simply continues tomorrow. Shares the masterlist
# concurrency group, because this job regenerates the same derived files a
# submission does.

on:
  schedule:
    - cron: "20 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: masterlist
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Nexus catalogue
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUS_API_KEY }}
        run: |
          if [ -z "$NEXUS_API_KEY" ]; then
            echo "NEXUS_API_KEY is not set; skipping the Nexus half."
            exit 0
          fi
          # Listing first (most endorsed, then newest updates), then the joins
          # that turn a catalogue into usable metadata.
          node scripts/bulk-list-nexus.mjs
          node scripts/bulk-list-nexus.mjs --updates
          node scripts/find-masterlist-on-nexus.mjs
          node scripts/crawl-requirements.mjs
          node scripts/enrich-from-nexus.mjs

      - name: mod.io catalogue
        env:
          MODIO_API_KEY: ${{ secrets.MODIO_API_KEY }}
        run: |
          if [ -z "$MODIO_API_KEY" ]; then
            echo "MODIO_API_KEY is not set; skipping the mod.io half."
            exit 0
          fi
          node scripts/bulk-list-modio.mjs
          node scripts/bulk-list-modio.mjs --updates
          node scripts/bulk-list-modio.mjs --deps

      # Catalogue data feeds the category fallback map and the Script Extender
      # flags in the masterlist, so a crawl that does not rebuild these leaves
      # the site running on yesterday's derivation.
      - name: Rebuild what the catalogues feed
        run: |
          node scripts/mine-corpus.mjs
          node scripts/build-divider-map.mjs
          node scripts/build-external-categories.mjs
          node -e "require('fs').copyFileSync('masterlist/bg3-masterlist.json','public/bg3-masterlist.json')"
          node scripts/verify-order.mjs | tail -6 >> "$GITHUB_STEP_SUMMARY"

      - name: Commit whatever changed
        run: |
          git config user.name "volo-crawler"
          git config user.email "crawler@users.noreply.github.com"
          git add nexus modio masterlist public client/src/lib/dividers.json
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "Update the catalogues"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
