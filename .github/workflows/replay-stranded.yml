name: Replay stranded submissions

# A submission whose run was cancelled never reports anything.
#
# GitHub keeps one pending run per concurrency group, so a third arrival
# cancels the one already waiting, and a cancelled job never reaches its
# reporting step. The submitter is left with an open issue and total silence,
# which reads exactly like the site being broken. Nothing in the pipeline
# notices, because nothing ran.
#
# This looks for submission issues that are open and have not been dealt with,
# and asks the submission workflow to run them again. Replaying is safe: intake
# rejects duplicates against the corpus, so an order that did land cannot land
# twice.
#
# It replays by dispatching, not by toggling the label, and that is the whole
# reason this file was ever worth anything. Toggling is the lever a person
# pulls, and GitHub does not start a workflow from an event its own token
# made, to stop workflows triggering each other forever. So every replay this
# ran went nowhere: it removed a label, waited, put it back, and wrote
# "replayed" into the summary, hourly, for its entire life. Issue #122 sat
# accepted and unlanded for fourteen hours underneath that, and the log said
# the net had caught it four times.
#
# Nothing about the detection was wrong, which is what made it convincing.

on:
  schedule:
    - cron: "35 * * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: replay-stranded
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - name: Find and replay
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Anything newer than this is probably still being processed.
          CUTOFF=$(date -u -d '20 minutes ago' +%Y-%m-%dT%H:%M:%SZ)

          numbers=$(gh issue list --repo "$REPO" \
            --label load-order-submission --state open \
            --json number,createdAt,updatedAt \
            --jq ".[] | select(.createdAt < \"$CUTOFF\") | .number")

          if [ -z "$numbers" ]; then
            echo "no open submissions old enough to consider"
            exit 0
          fi

          for n in $numbers; do
            # A bot comment means the pipeline did reply, whatever it decided,
            # so the submitter is not in the dark and nothing needs replaying.
            replied=$(gh issue view "$n" --repo "$REPO" --json comments \
              --jq '[.comments[] | select(.author.login == "github-actions")] | length')
            if [ "$replied" != "0" ]; then
              echo "#$n already has $replied pipeline comment(s), leaving it"
              continue
            fi

            echo "#$n has no reply from the pipeline, replaying"
            gh workflow run process-submission.yml --repo "$REPO" --ref main -f issue="$n"
            echo "replayed=$n" >> "$GITHUB_STEP_SUMMARY"

            # One per run. Each replay takes the masterlist group, and queueing
            # several would recreate the cancellation this exists to undo.
            break
          done

      # Accepted, reported, and still not on main.
      #
      # The pass above keys on silence, so it cannot see this one. The order was
      # validated and the submitter was told so in as many words; what failed
      # came after the comment was written. Issue #105 sat open exactly like
      # this, with a full acceptance report on it and nothing in the corpus,
      # because #104 landed first and the landing step could not rebase onto it.
      #
      # Both passes here treated that comment as proof the pipeline had dealt
      # with the order. A comment only proves the pipeline spoke.
      #
      # The acceptance comment names the corpus file, and main either holds that
      # file or it does not, so the test is exact rather than inferred. Orders
      # held for review are accepted and deliberately absent from main, so they
      # are excluded by their label. Rejected orders never get an acceptance
      # comment at all, so they cannot be replayed in a loop by this.
      - name: Replay orders accepted but never landed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          CUTOFF=$(date -u -d '20 minutes ago' +%Y-%m-%dT%H:%M:%SZ)

          candidates=$(gh issue list --repo "$REPO" \
            --label load-order-submission --state open \
            --json number,createdAt,labels \
            --jq ".[]
                  | select(.createdAt < \"$CUTOFF\")
                  | select([.labels[].name] | index(\"held-for-review\") | not)
                  | .number")

          if [ -z "$candidates" ]; then
            echo "no open submissions old enough to check"
            exit 0
          fi

          # One listing, then membership, because the corpus path contains
          # spaces and encoding it per file invites a quiet 404 that would read
          # as "not landed" for every order.
          landed=$(gh api "repos/$REPO/contents/Load%20Orders%20-%20Public%20Submitted" \
            --jq '.[].name')

          for n in $candidates; do
            file=$(gh issue view "$n" --repo "$REPO" --json comments \
              --jq '[.comments[]
                     | select(.author.login == "github-actions")
                     | .body
                     | capture("Submission accepted: (?<f>[^\r\n]+)").f] | last // empty')

            if [ -z "$file" ]; then
              echo "#$n has no acceptance comment, leaving it to the pass above"
              continue
            fi

            if printf '%s\n' "$landed" | grep -qxF "$file"; then
              echo "#$n landed as $file"
              continue
            fi

            echo "#$n was accepted as $file and main does not have it, replaying"
            gh workflow run process-submission.yml --repo "$REPO" --ref main -f issue="$n"
            echo "replayed unlanded acceptance=$n ($file)" >> "$GITHUB_STEP_SUMMARY"
            break
          done

      # An approval that was cancelled is invisible to the pass above.
      #
      # That one replays issues with no reply at all, which is right for a
      # submission whose first run never happened. A held order already has its
      # diagnosis comment, so it can never look silent, and a cancelled approval
      # therefore sits labelled and unlanded forever with nothing noticing.
      #
      # The label is the record. Landing clears `approved`, so an issue still
      # carrying it after the work should have finished is an approval that never
      # reached main. Replaying is safe for the same reason as above: intake
      # rejects an order already in the corpus, so this cannot land anything
      # twice.
      #
      # Keyed on updatedAt rather than createdAt, because the interesting event
      # is the labelling, and a submission from last week can be approved today.
      - name: Replay approvals that never landed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          CUTOFF=$(date -u -d '20 minutes ago' +%Y-%m-%dT%H:%M:%SZ)

          stalled=$(gh issue list --repo "$REPO" \
            --label approved --state open \
            --json number,updatedAt \
            --jq ".[] | select(.updatedAt < \"$CUTOFF\") | .number" | head -1)

          if [ -z "$stalled" ]; then
            echo "no approvals waiting longer than they should be"
            exit 0
          fi

          echo "#$stalled is still labelled approved and has not landed, replaying"
          gh workflow run process-submission.yml --repo "$REPO" --ref main -f issue="$stalled"
          echo "replayed stalled approval=$stalled" >> "$GITHUB_STEP_SUMMARY"
