<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Tells the browser to render scrollbars, form controls and the address
         bar dark, which it will not infer from a class on the body. -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#161411" />
    <title>VOLO: Load Order Optimisation for Baldur's Gate 3</title>
    <meta name="description" content="Sort your Baldur's Gate 3 mod load order against orders players have actually played on. Runs in your browser, nothing to install, and every placement shows its reasoning." />
    <!--
      Two, because browsers and crawlers ask for /favicon.ico at the root
      whether or not a link element names one: it was the site's most requested
      missing file, fifteen 404s a day. The png is declared for anything that
      prefers it, and the ico carries 16, 32 and 48 for tabs and bookmarks.
    -->
    <link rel="icon" href="/assets/volo-logo-128.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <!--
      Defaults for the home page and for anything reading the HTML before the
      app runs. src/lib/head.ts rewrites both as the route changes.
    -->
    <link rel="canonical" href="https://volobg3.com/" />
    <meta name="robots" content="index, follow" />

    <meta property="og:title" content="VOLO: Load Order Sorting for Baldur's Gate 3" />
    <meta property="og:description" content="Sort your Baldur's Gate 3 mod load order against orders players have actually played on. Runs in your browser, and every placement shows its reasoning." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://volobg3.com/" />
    <meta property="og:site_name" content="VOLO" />
    <!--
      The sorted order rather than the logo. A preview image is meant to show
      what the page is about, and a wordmark shows nothing; this is the tool
      doing the one thing it exists to do, labels and all.
    -->
    <meta property="og:image" content="https://volobg3.com/assets/volo-sorted-order-preview.v2.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A sorted Baldur's Gate 3 load order in VOLO, each mod labelled with the section it belongs to and how its placement was decided." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://volobg3.com/assets/volo-sorted-order-preview.v2.png" />

    <!--
      Describes the tool itself. Kept in the static HTML so it is readable
      without executing the app, and deliberately limited to what is true:
      a free browser tool, with no ratings invented.

      Every property here belongs to WebApplication or something it inherits
      from. primaryImageOfPage and codeRepository were both wrong: the first
      belongs to WebPage and the second to SoftwareSourceCode, neither of which
      this is. `image` carries the preview and `sameAs` carries the repository.
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "VOLO",
      "alternateName": [
        "Verified Order and Load Optimisation",
        "VOLO BG3",
        "VOLO Baldur's Gate 3"
      ],
      "url": "https://volobg3.com/",
      "applicationCategory": "UtilitiesApplication",
      "operatingSystem": "Any, runs in a web browser",
      "browserRequirements": "Requires JavaScript",
      "description": "Sorts Baldur's Gate 3 mod load orders against a masterlist built from load orders players have played on, resolving declared dependencies and explaining every placement.",
      "isAccessibleForFree": true,
      "image": "https://volobg3.com/assets/volo-sorted-order-preview.v2.png",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "GBP" },
      "license": "https://github.com/Moonie8t7/VOLO/blob/main/LICENSE",
      "sameAs": [
        "https://github.com/Moonie8t7/VOLO",
        "https://www.nexusmods.com/baldursgate3/mods/24316"
      ],
      "about": { "@type": "VideoGame", "name": "Baldur's Gate 3" }
    }
    </script>

    <!--
      The typeface is served from this origin now, declared in src/index.css,
      so there is no second origin to connect to and no stylesheet to wait on.
      It is deliberately not preloaded. A preload hint puts the 44kb font in
      the same window as the render-blocking stylesheet and the two compete for
      a throttled connection: measured at 390px on a slow link, preloading it
      pushed the stylesheet from 1940ms to 2169ms and the first paint from
      2004ms to 2324ms. font-display: swap means the text paints in the
      fallback face regardless, so nothing is gained by fetching the real one
      sooner than the stylesheet that asks for it.
    -->
  </head>
  <body class="dark bg-background text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
