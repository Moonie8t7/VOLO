name: Sweep dropped submissions

# GitHub keeps one pending run per concurrency group and replaces it whenever
# a newer run arrives, so a burst of issues loses every run but the last. Six
# placement reports in eleven minutes on 13 September 2026 lost five: no order
# landed, no reply was posted, and nothing anywhere said so. Intake's own
# replay lever, removing and re-adding the label, cannot help here, because a
# label toggled by the workflow token starts nothing. A dispatch does.
#
# This finds open issues intake would process that have never had a reply
# from it, and dispatches the oldest. One at a time, and only when nothing is
# queued, so this is never the run that evicts a real one. The next sweep
# takes the next issue.

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  issues: read

concurrency:
  group: sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the oldest submission intake has not answered
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # A run already waiting for the group would be replaced by a
          # dispatch, which is the failure this exists to repair.
          waiting=0
          for status in queued pending waiting requested; do
            n=$(gh run list --workflow process-submission.yml --status "$status" --json databaseId --jq 'length')
            waiting=$((waiting + n))
          done
          if [ "$waiting" != "0" ]; then
            echo "$waiting run(s) waiting for the intake group; nothing dispatched"
            exit 0
          fi

          # The same gate as the intake workflow's own `if`: a submission, by
          # label or by the heading its template writes, or a placement
          # report that says its order was played on. An issue younger than
          # ten minutes may have a run in flight that has not commented yet.
          gh issue list --state open --limit 200 --json number,createdAt,labels,body,comments \
            --jq '
              [ .[]
                | select(
                    any(.labels[].name; . == "load-order-submission")
                    or ((.body // "") | contains("### Does this load order work?"))
                    or (
                      (any(.labels[].name; . == "wrong-placement") or ((.body // "") | contains("### Where VOLO put it")))
                      and ((.body // "") | contains("Working, I have played on it"))
                    )
                  )
                | select(any(.comments[].author.login; . == "github-actions") | not)
                | select(.createdAt < (now - 600 | todate))
              ]
              | sort_by(.createdAt)
              | .[0].number // empty
            ' > /tmp/next.txt

          next=$(cat /tmp/next.txt)
          if [ -z "$next" ]; then
            echo "every open submission has been answered"
            exit 0
          fi
          echo "issue #$next has no reply from intake; dispatching it"
          gh workflow run process-submission.yml --ref main -f issue="$next"
