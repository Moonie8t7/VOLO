name: Regenerate the masterlist

# The corpus is the source of truth; the masterlist is derived from all of it.
# Whenever the corpus changes on main by any route (a merged submission pull
# request, a hand-added order), this rebuilds the masterlist so it can never
# reflect only some of the orders present.
#
# Submissions that land directly already commit a fresh masterlist, and pushes
# made with GITHUB_TOKEN do not start new runs, so this does not duplicate that
# work or loop on its own commit.

on:
  push:
    branches: [main]
    paths:
      - 'Load Orders - Public Submitted/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: masterlist
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so build-sitemap can read each page's real last
          # change date. A shallow clone reports HEAD for every file.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Everything here is derived from the corpus, so each attempt starts from
      # whatever main holds now and rebuilds from that. Nothing is rebased:
      # regenerating on top of the current tip produces the same answer as
      # merging two regenerations would, without the conflicts that come with
      # rebasing large generated files.
      #
      # The reset also keeps the tree clean between attempts. Building writes
      # more files than the previous version staged, sitemap.xml and the
      # catalogue copy among them, and the leftovers made `git pull --rebase`
      # refuse to run at all.
      - name: Rebuild, verify and commit
        run: |
          set -euo pipefail
          git config user.name "volo-submissions"
          git config user.email "submissions@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            node scripts/mine-corpus.mjs
            node scripts/learn-category-order.mjs
            node scripts/build-divider-map.mjs
            node scripts/build-external-categories.mjs
            node -e "require('fs').copyFileSync('masterlist/bg3-masterlist.json','public/bg3-masterlist.json')"
            node -e "require('fs').copyFileSync('masterlist/external-categories.json','public/external-categories.json')"
            node scripts/verify-order.mjs | tail -6 >> "$GITHUB_STEP_SUMMARY"
            node scripts/verify-holdout.mjs | tail -8 >> "$GITHUB_STEP_SUMMARY"
            node scripts/sync-figures.mjs

            # Pushes made with the workflow token do not trigger the checks
            # workflow, so this would otherwise land unverified.
            npm run check
            npm run build
            npm test

            git add masterlist public client/src/lib README.md docs/decisions.md
            if git diff --cached --quiet; then
              echo "masterlist already matches the corpus"
              exit 0
            fi
            git commit -m "Regenerate the masterlist from the corpus"

            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push rejected on attempt $attempt, rebuilding on the new tip"
          done

          echo "could not land the regeneration after three attempts"
          exit 1
